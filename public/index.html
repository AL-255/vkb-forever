<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202c2b">
  <meta name="description" content="Edit Yamaha VKB-100 vocal parameters, instrument parameters, and lyric memories over Bluetooth MIDI.">
  <title>VKB Forever — VKB-100 MIDI editor</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to editor</a>
  <aside class="sidebar">
    <a class="brand" href="#vocal" aria-label="VKB Forever home"><span class="brand-mark" aria-hidden="true">v<span>k</span>b</span><span>FOREVER<span class="brand-sub">VKB-100 MIDI EDITOR</span></span></a>
    <div class="nav-label">EDITORS</div>
    <nav aria-label="Workspace">
      <a href="#vocal" data-route="vocal"><span class="nav-icon">◉</span> Vocals</a>
      <a href="#pcm" data-route="pcm"><span class="nav-icon">▥</span> Instruments</a>
      <a href="#lyric" data-route="lyric"><span class="nav-icon">≋</span> Lyrics</a>
      <a href="#library" data-route="library"><span class="nav-icon">▧</span> Library <span class="library-count">0</span></a>
    </nav>
    <div class="sidebar-rule"></div>
    <nav aria-label="Utilities"><a href="#device" data-route="device"><span class="nav-icon">⌁</span> Keyboard & settings</a><a href="#help" data-route="help"><span class="nav-icon">?</span> Help</a></nav>
    <div class="sidebar-bottom"><span class="small muted">Version 0.1</span></div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div class="breadcrumb">WORKSPACE <span>/</span> <strong id="breadcrumb">Vocal editor</strong></div><div class="top-actions"><span id="connection-badge" class="status-badge"><i></i> Offline</span><button class="button dark" id="connect">⌁ <span>Connect keyboard</span></button></div></header>
    <main id="main" tabindex="-1"><div class="boot">Loading editor…</div></main>
    <footer class="footer"><span><i class="local-dot"></i> <span id="save-state">Saved on this browser</span></span><a href="#device" id="session-state">No keyboard connected</a></footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><form method="dialog"><button class="dialog-close" aria-label="Close dialog">×</button></form><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
